spring.config.import=file:env.properties
spring.application.name=build-week-4
spring.datasource.url=jdbc:postgresql://localhost:5432/BUILD-WEEK-4
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=3001
jwt.secret=${JWT_SECRET}

# utenti iniziali creati da DataSeeder al primo avvio.
# Le password stanno in env.properties, che non e' versionato.
seed.admin.email=admin@buildweek4.it
seed.admin.password=${SEED_ADMIN_PASSWORD}
seed.commerciale.email=commerciale@buildweek4.it
seed.commerciale.password=${SEED_COMMERCIALE_PASSWORD}
seed.user.email=user@buildweek4.it
seed.user.password=${SEED_USER_PASSWORD}